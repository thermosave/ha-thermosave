rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: The pythermosave client is vendored instead of published on PyPI.
  docs-actions:
    status: exempt
    comment: The integration does not register actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only subscribe to the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: Devices are cloud-connected and found through the account.
  discovery-update-info:
    status: exempt
    comment: Devices are cloud-connected and found through the account.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category:
    status: todo
    comment: Last seen, Timezone and Online could be diagnostic entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: Consider disabling Last seen and Timezone by default.
  entity-translations: done
  exception-translations: todo
  icon-translations:
    status: todo
    comment: Icons are set with _attr_icon.
  reconfiguration-flow:
    status: exempt
    comment: The only configuration is the account, which reauth covers.
  repair-issues:
    status: exempt
    comment: The integration has no user-repairable issues.
  stale-devices:
    status: todo
    comment: Devices removed from the account stay in the device registry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: Requires a typed client published on PyPI and a mypy check.
