# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"  # oldest Python supported by the minimum Home Assistant version in hacs.json

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "ARG001", # Home Assistant platform setup signatures require unused `hass`
    "ARG002", # Home Assistant entity method signatures require unused arguments
    "EM101", # raw-string-in-exception (not used by Home Assistant core)
    "EM102", # f-string-in-exception (not used by Home Assistant core)
    "RUF012", # Mutable class attributes (ignored by Home Assistant core)
    "TRY003", # Long exception messages (ignored by Home Assistant core)
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
